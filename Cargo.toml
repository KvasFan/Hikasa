[workspace]
resolver = "3"
members = [
    # core: UI-agnostic engines and services (no I/O in engines, no UI anywhere)
    "core/hikasa-core",
    "core/hikasa-vfs",
    "core/hikasa-diff",
    "core/hikasa-formats",
    "core/hikasa-folder",
    "core/hikasa-text",
    "core/hikasa-table",
    "core/hikasa-hex",
    "core/hikasa-picture",
    "core/hikasa-metadata",
    "core/hikasa-report",
    "core/hikasa-script",
    "core/hikasa-session",
    # cli: the complete headless interface to every function
    "cli/hikasa-cli",
    # gui: desktop application built on core, reachable from the CLI over IPC
    "gui/hikasa-gui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KvasFan/Hikasa"
authors = ["Hikasa contributors"]
rust-version = "1.85"

# Dependencies are intentionally not declared yet (version 0.0.0 = specification only).
# See docs/02-tech-stack.md for the approved crate list.
[workspace.dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
