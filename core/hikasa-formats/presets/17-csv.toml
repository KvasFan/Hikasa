# Sources: docs/10-file-formats.md §5 (D-26: the mask is *.csv;*.tsv); RFC 4180 (comma-separated values,
# double-quote text qualifier). Written for Hikasa.
schema_version = 1
id = "csv"
name = "Comma Separated Values"
description = "Delimited tables, compared by the table engine (*.tsv is read as tab-delimited); text views show the plain text."
kind = "table"
mask = "*.csv;*.tsv"

[encoding]
mode = "auto"

[table]
delimiter = ","
qualifier = '"'
