schema_version = 1
type = "table-compare"
description = "A table-compare session"
favorite = true

[specs]
left = "/data/left"
right = "/data/right"
format = "csv"

[rules]
keys = ["id"]
sheets = "position"
tolerance = ["price=0.5%"]

[rules.parse]
delimiters = [";"]

[display]
filter = "differences"

[view]
split = 0.5
width_left = 300
