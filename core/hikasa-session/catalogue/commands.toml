# The command catalogue of Hikasa (ARCH-070, UI-003; M2 contract §1.0.2).
#
# This file is the source of `docs/reference/commands.md` (`cargo xtask commands-doc`). Every command has a
# stable id, the menu it belongs to, its caption, its default shortcut (reference spelling), a description
# and a status: `implemented` (the GUI executes it) or `planned`. Rows keep the reference order.

schema_version = 1
title = "Command Catalogue (default shortcuts)"
intro = """
Generated reference. Columns: command id, category (menu), caption, default shortcut, description.
Captions ending with "…" open a dialog. Commands without a caption are toolbar/gutter-only or dynamic (caption computed at runtime).
Shortcuts use Ctrl on Linux/Windows; on macOS Ctrl maps to Cmd unless noted.
"""

