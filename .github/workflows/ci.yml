name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # No GUI system packages: eframe/egui with the default features load X11, Wayland,
      # xkbcommon and fontconfig at run time (dlopen) and build with the runner's C
      # compiler alone. The window tests are ignored by default and do not run here.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # `xmllint` checks the XML reports against docs/schemas/hikasa-report-1.xsd (m2-contracts §1.7.7). macOS ships it
      # with its libxml2; Windows skips the check, the goldens prove the same bytes there.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: cargo clippy --workspace --all-targets
      # nextest runs every test binary (also the `harness = false` launch tests); doc tests need cargo test.
      - run: cargo nextest run --workspace --profile ci
        env:
          # A missing `xmllint` fails the schema test on Linux and macOS instead of skipping it.
          HIKASA_REQUIRE_XMLLINT: ${{ runner.os != 'Windows' && '1' || '0' }}
      - run: cargo test --workspace --doc

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # docs/reference/commands.md is generated from the command catalogue; every help topic and link resolves.
      - run: cargo xtask commands-doc --check
      - run: cargo xtask help-check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
