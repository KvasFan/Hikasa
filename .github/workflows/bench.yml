name: Bench

# The criterion benches and the performance gates (contract §6.4; M2 plan Q12a). Started by hand only: a shared
# GitHub-hosted runner is noisy, and the reference figures in the docs come from runs on a fixed machine by hand.
#
# The 25 % tolerance covers only the first step: `--noise-threshold 0.25` makes criterion call a change against the
# baseline noise up to 25 %, and it reports, it never fails the job. The gates of the second step know no baseline and no
# tolerance: each compares with its absolute threshold (`perf_gates.rs`) and fails the job when past it. G6 CRC is a
# bench, so it is a ratio in the first step's output, read by hand.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "criterion baseline name to compare against (empty: just record)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: criterion benches
        run: |
          if [ -n "${{ inputs.baseline }}" ]; then
            cargo bench --workspace -- --baseline "${{ inputs.baseline }}" --noise-threshold 0.25
          else
            cargo bench --workspace -- --save-baseline ci
          fi
      - name: every performance gate through the binary (G1, G2, G6 list, G6 compare and their memory budgets)
        run: cargo test --release -p hikasa-cli --test perf_gates -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: criterion
          path: target/criterion
