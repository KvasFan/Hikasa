# cargo-deny configuration: enforces the license policy from docs/02-tech-stack.md
[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "CC0-1.0", "Unlicense", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016",
    "OpenSSL", "BSL-1.0", "0BSD",
    # BSD-style, OSI- and FSF-approved; reached through the GUI toolkit's image stack (libfuzzer-sys).
    "NCSA",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
