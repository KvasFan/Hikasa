# cargo-deny configuration: enforces the license policy from docs/02-tech-stack.md
[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "CC0-1.0", "Unlicense", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016",
    "OpenSSL", "BSL-1.0", "0BSD",
]
confidence-threshold = 0.9

# Free font licences, accepted only for the fonts egui embeds by default.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
