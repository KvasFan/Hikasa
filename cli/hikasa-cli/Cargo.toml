[package]
name = "hikasa-cli"
description = "The hikasa command line: quick, text and folder compare, formats, VFS access and IPC control of the GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
hikasa-core.workspace = true
hikasa-vfs.workspace = true
hikasa-diff.workspace = true
hikasa-formats.workspace = true
hikasa-text.workspace = true
hikasa-folder.workspace = true
hikasa-report.workspace = true
hikasa-session.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jiff.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
pretty_assertions.workspace = true
filetime.workspace = true

[[bin]]
name = "hikasa"
path = "src/main.rs"

# The launch tests (contract §6.3, `cli_gui.rs`): a test binary without libtest whose `main` runs its cases, or
# acts as the scripted stand-in for `hikasa-gui` when `HIKASA_TEST_FAKE_GUI=1` (the tests launch the binary itself
# through `HIKASA_GUI_EXE`), so no fake GUI is a product binary.
[[test]]
name = "cli_gui_launch"
path = "tests/cli_gui_launch.rs"
harness = false

# The G1 and G2 gates through the binary (contract §6.4, §6.5 wave 5): ignored by default, run in release mode
# with `cargo test --release -p hikasa-cli --test perf_gates -- --ignored`.
[[test]]
name = "perf_gates"
path = "tests/perf_gates.rs"

[lints]
workspace = true
