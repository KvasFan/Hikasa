schema_version = 1
id = "sql"
name = "My SQL"
description = ""
kind = "text"
mask = "*.sql;*.mysql"

[conversion]
method = "none"

[encoding]
mode = "auto"

[text]
tab_size = 4
tab_as_spaces = false
lines_independent = false
column_based = false
ctrl_z_eof = false
save_trim_trailing_ws = false
save_leading_spaces_to_tabs = false
word_chars = ""

[[grammar]]
element = "Comment"
kind = "delimited"
from = "--"
stop_at_eol = true

[[grammar]]
element = "String"
kind = "delimited"
from = "'"
to = "'"
stop_at_eol = true
